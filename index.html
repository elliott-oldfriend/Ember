<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Ember Image Generator">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Image Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Dark UI built from the gradient's black (#191817) and white (#F9F5EF) */
  --bg:#191817; --panel:#1f1e1c; --line:#353330; --text:#f9f5ef; --muted:#a39e96;
  --accent:#f9f5ef; --stage:#121110; --hist:#5a5752; --row-hover:#292725; --btn:#262422;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
}
.bar h1{font-size:15px;font-weight:600;margin:0 auto 0 0;letter-spacing:-.005em}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);
  background:var(--btn);cursor:pointer;user-select:none;-webkit-user-select:none;font-weight:500;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#191817}
.btn.primary:hover{filter:brightness(1.08)}
.btn[hidden]{display:none}
.btn svg{width:16px;height:16px}
.btn.holding,.btn.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--btn))}
.check:not(label){color:var(--muted);cursor:default}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.stage{
  position:relative;display:grid;place-items:center;
  padding:28px;min-height:0;overflow:hidden;background:var(--stage);
}
#view{display:block;max-width:100%;max-height:100%;box-shadow:0 0 0 1px rgba(0,0,0,.28),0 8px 28px rgba(0,0,0,.25)}
.meta{
  position:absolute;left:12px;bottom:10px;margin:0;font-size:12px;
  color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:4px;
  font-variant-numeric:tabular-nums;
}
.badge{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);
  padding:4px 10px;border-radius:999px;pointer-events:none;
}
.badge[hidden]{display:none}
.drop{
  position:absolute;inset:12px;border:2px dashed rgba(255,255,255,.8);border-radius:10px;
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;
  background:rgba(0,0,0,.35);pointer-events:none;
}
.drop[hidden]{display:none}
.toast{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:var(--panel);color:var(--text);border:1px solid var(--line);
  padding:8px 14px;border-radius:6px;font-size:13px;max-width:90%;
}
.toast[hidden]{display:none}
.fail{color:#fff;max-width:36ch;text-align:center}

.panel{overflow:auto;border-left:1px solid var(--line);background:var(--panel)}
.panel-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:14px 16px 8px;
}
.panel-head h2{font-size:13px;font-weight:600;margin:0}
.panel-head p{margin:0;font-size:12px;color:var(--muted)}
#layers{list-style:none;margin:0;padding:0 8px 16px}
.layer{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel)}
.layer.off .name,.layer.off .controls{opacity:.5}
.row{display:flex;align-items:center;gap:2px;padding:4px}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;flex:none;
  border:0;background:none;border-radius:5px;cursor:pointer;color:var(--muted);
}
.icon-btn:hover{background:var(--row-hover);color:var(--text)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.icon-btn svg{width:16px;height:16px}
.name{
  flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  border:0;background:none;cursor:pointer;text-align:left;padding:4px 6px;border-radius:5px;
}
.name:hover{background:var(--row-hover)}
.thumb{
  width:28px;height:28px;flex:none;border-radius:4px;display:grid;place-items:center;
  background:var(--row-hover);border:1px solid var(--line);color:var(--text);
}
.thumb svg{width:16px;height:16px}
.thumb img,.thumb canvas{width:100%;height:100%;object-fit:cover;border-radius:3px}
.label{display:flex;flex-direction:column;min-width:0}
.label b{font-weight:600;font-size:13px}
.label small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);transition:transform .15s}
.layer.open .chev{transform:rotate(90deg)}
.controls{display:none;padding:2px 14px 14px 14px;border-top:1px solid var(--line)}
.layer.open .controls{display:block}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:8px;margin-top:12px}
.field label{font-size:12.5px}
.field output{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=range]{grid-column:1 / -1;width:100%;margin:6px 0 0;accent-color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin:14px 0 0}
.hist{width:100%;height:72px;display:block;margin-top:12px;border-radius:4px;background:var(--row-hover)}
.inline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--accent);margin:0}
.small-btn{height:28px;padding:0 10px;font-size:12.5px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--btn);cursor:pointer;overflow:hidden}
.step:hover{border-color:var(--muted)}
.step[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .blob{width:16px;height:16px;border-radius:50%;background:var(--text);display:block}
.step[aria-pressed="true"] .pname{color:var(--accent)}
.row .name:first-child{margin-left:2px}
.preset{display:flex;flex-direction:column;gap:6px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--btn);cursor:pointer;text-align:left}
.preset:hover{border-color:var(--muted)}
.preset[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .gstrip{display:block;height:22px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.presets{display:flex;gap:14px}
.presets .preset{width:46px;height:46px;padding:4px;border-radius:50%;flex:none}
.presets .dot{display:block;width:100%;height:100%;border-radius:50%;transform:rotate(-45deg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#layers .plain{margin-bottom:6px}
#layers .plain[hidden],#layers .plain:has(> [hidden]){display:none}
.btn.wide{width:100%;justify-content:center;height:38px}
.panel-head{height:8px}
.pname{font-size:12.5px;font-weight:500;padding:0 2px 1px}
.preset[aria-checked="true"] .pname{color:var(--accent)}
.swatch{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.swatch input{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer;flex:none}
.swatch input::-webkit-color-swatch-wrapper{padding:2px}
.swatch input::-webkit-color-swatch{border:0;border-radius:3px}
.swatch span{display:flex;flex-direction:column;line-height:1.25}
.swatch b{font-size:12.5px;font-weight:500}
.swatch small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.switch{margin-left:auto;margin-right:6px;width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--btn);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(16px);background:#191817}
.anglerow{display:flex;align-items:center;gap:14px;margin-top:12px}
.dial{width:64px;height:64px;flex:none;border-radius:50%;cursor:grab;touch-action:none;color:var(--text)}
.dial:active{cursor:grabbing}
.dial svg{width:100%;height:100%;display:block}
.anglemeta{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;flex:1}
.anglemeta .top{display:flex;justify-content:space-between;width:100%;font-size:12.5px}
.anglemeta output{color:var(--muted);font-variant-numeric:tabular-nums}
.upload{width:100%;display:flex;align-items:center;gap:12px;padding:8px;border:0;background:none;cursor:pointer;border-radius:8px;text-align:left}
.upload:hover{background:var(--row-hover)}
.upload .bigthumb{width:56px;height:56px;flex:none;border-radius:6px;overflow:hidden;background:var(--row-hover);border:1px solid var(--line)}
.upload .bigthumb img{width:100%;height:100%;object-fit:cover;display:block}
.upload svg{width:16px;height:16px;margin-left:auto;color:var(--muted);flex:none}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
.genrow{display:flex;align-items:center;gap:10px;padding:10px 12px}
.genrow .label{flex:1}
.hint{font-size:12px;color:var(--muted);padding:4px 16px 18px;margin:0}

@media (max-width:760px){
  body{height:auto;min-height:100%}
  .app{grid-template-columns:1fr}
  .stage{height:56vh;padding:14px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .bar h1{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
/* ---- minimal pass: no collapse controls, no outlines, no readouts ---- */
.bar{border-bottom:0;background:var(--bg)}
.panel{border-left:0;background:var(--bg)}
#view{box-shadow:0 10px 40px rgba(0,0,0,.45)}
.btn{border:0;background:var(--btn)}
.btn:hover{background:var(--row-hover)}
.btn.primary:hover{background:var(--accent);filter:brightness(.94)}
#layers{padding:4px 12px 24px}
.layer{border:0;background:none;margin-bottom:18px;border-radius:0}
#layers .plain{margin-bottom:18px}
.row{padding:0}
.row .name{padding:0;cursor:default;gap:0}
.row .name:hover{background:none}
.row .name .thumb,.chev{display:none}
.label b{font-size:12.5px;font-weight:500;color:var(--muted)}
.row .label small,.genrow small{display:none}
.controls,.layer .controls{display:block;border-top:0;padding:0}
.field{margin-top:6px}
.field label,.field output,.anglemeta .top{display:none}
.field input[type=range]{margin-top:0}
.anglerow{margin-top:10px}
.anglemeta{justify-content:center}
.dial svg > circle:first-of-type{stroke:none}
.steps,.presets{margin-top:10px}
.step{border:0;padding:12px 4px}
.step:hover{border:0;background:var(--row-hover)}
.step .pname{display:none}
.step[aria-pressed="true"]{background:var(--accent);box-shadow:none}
.step[aria-pressed="true"] .blob{background:#191817}
.presets .preset{border:0;background:var(--btn)}
.presets .preset:hover{background:var(--row-hover);box-shadow:none}
.presets .preset[aria-checked="true"]{box-shadow:0 0 0 2px var(--accent)}
.presets .dot{box-shadow:none}
.switch{border:0}
.switch[aria-pressed="true"]{border:0}
.upload{padding:0}
.upload:hover{background:none}
.upload:hover .bigthumb{opacity:.85}
.upload .bigthumb{border:0}
.upload .label b{color:var(--text)}
.genrow{padding:0;gap:8px}
.hint,.meta{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar-spacer{flex:1}
.bar{padding:14px 20px;gap:14px}
.brand-word{height:30px;width:auto;display:block}
.panel{display:flex;flex-direction:column}
.brand-slot{flex:1;display:grid;place-items:center;min-height:140px;padding:24px 0}
.brand-mark{height:72px;width:auto;display:block;pointer-events:none}
.stage{background:var(--bg)}
@media (max-width:760px){.brand-word{height:20px}.brand-mark{height:48px}}
@font-face{font-family:"Pitch Sans";src:url("pitch-sans-web-bold.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* typography: Afacad for the large actions, Pitch Sans (from the repo) for the small text */
body{font-family:"Afacad",system-ui,-apple-system,"Segoe UI",sans-serif}
#reset,#random,#export{font-family:"Pitch Sans","IBM Plex Mono",ui-monospace,monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
#reset{height:36px;padding:0 16px}
.label b,.label small,.upload .label b,.genrow .btn,.anglemeta .btn,.toast,.drop{font-family:"Pitch Sans","IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:11.5px;letter-spacing:0}
.label b,.label small,.upload .label b,.genrow .btn,.anglemeta .btn,.toast,.drop{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.label b{font-weight:400}
.upload .label b{font-weight:500}
/* panel runs to the top; the wordmark floats over the preview's top-left */
body{grid-template-rows:1fr}
.bar{position:absolute;top:env(safe-area-inset-top,0px);left:0;z-index:2;padding:22px 28px;background:none;pointer-events:none}
.app{height:100%}
.stage{padding-top:84px}
#layers{padding-top:22px}
.presets{align-items:center}
.presets #reset{margin-left:auto}
@media (max-width:760px){.bar{padding:14px 16px}.stage{padding-top:56px}}
</style>
</head>

<script>
(() => {
"use strict";

/* ---------- state ---------- */
// Defaults match Direction_1_Sandbox_V2.psd
const IDS = ["grain", "gradient", "levels", "gaussian", "motion"];
const DEFAULTS = {
  order: IDS.slice(), // top to bottom, like Photoshop
  grain:    { on: true, amount: 55, size: 1.25, mono: true, seed: 1 },
  gradient: { on: true, preset: "neutral" },
  levels:   { on: true, tone: 0, invert: false }, // tone 0 = the PSD's Levels (31, 0.75, 255)
  gaussian: { on: true, radius: 0 },
  motion:   { on: true, angle: 0, distance: 45 },
};
const STORE_KEY = "layer-stack-editor-v6";
// Gradient map presets. Midpoint 53% reproduces Photoshop's blend for the PSD.
const GRADIENT_MID = 53;
const PRESETS = {
  neutral: { name: "Neutral", dark: "#191817", light: "#f9f5ef" },
  blue:    { name: "Blue",    dark: "#252c2d", light: "#0086ff" },
  red:     { name: "Red",     dark: "#3a211f", light: "#ff3600" },
};
// One dark-to-light slider drives input shadows and midtones.
function levelsParams(L) {
  const t = L.tone / 100;
  if (t < 0) return { ib: Math.round(31 + (90 - 31) * -t), gamma: 0.75 * Math.pow(0.4 / 0.75, -t) };
  return { ib: Math.round(31 * (1 - t)), gamma: 0.75 * Math.pow(2.2 / 0.75, t) };
}
const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && Array.isArray(saved.order) && saved.order.length === IDS.length && IDS.every(k => saved.order.includes(k))) {
    state = { ...clone(DEFAULTS), ...saved };
    for (const k of IDS) state[k] = { ...DEFAULTS[k], ...saved[k] };
  }
} catch (e) { /* storage unavailable */ }
// Grain is locked: always on, always on top, always the PSD-matched setting.
const GRAIN_LOCKED = true;
if (GRAIN_LOCKED) {
  state.grain = clone(DEFAULTS.grain);
}
state.order = IDS.slice(); // layers are locked in place
for (const k of IDS) state[k].on = true; // layers can't be turned off
// "More blur" steps (Gaussian radius in px); 0 = none selected
const BLUR_STEPS = [6, 14, 28, 50];
if (state.gaussian.radius && !BLUR_STEPS.includes(state.gaussian.radius)) state.gaussian.radius = 0;
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }, 250);
}

const open = { grain: true, gradient: true, levels: true, gaussian: true, motion: true }; // sections are always expanded

const ICON = {
  eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>',
  eyeOff: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l12 12M6.6 4.1A6.4 6.4 0 0 1 8 3.5c4 0 6.5 4.5 6.5 4.5a11 11 0 0 1-2 2.6M4.3 5.4A11 11 0 0 0 1.5 8S4 12.5 8 12.5c1 0 1.9-.3 2.7-.7"/></svg>',
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 13V3M4 7l4-4 4 4"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M4 9l4 4 4-4"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4l4 4-4 4"/></svg>',
  invert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12Z" fill="currentColor"/></svg>',
  upload: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 11v2.5h12V11M8 2.5v8M4.5 6 8 2.5 11.5 6"/></svg>',
  lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="7" width="9" height="6.5" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
  motion: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5h7M1 8h9M3 11h6"/><circle cx="12" cy="8" r="2.5"/></svg>',
  gaussian: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 13c3 0 3.5-9 7-9s4 9 7 9"/></svg>',
  levels: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13V9M5 13V5M8 13V3M11 13V6M14 13v-3"/></svg>',
  gradient: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="4.5" width="13" height="7" rx="1"/><path d="M5 4.5v7M8 4.5v7M11 4.5v7" stroke-opacity=".5"/></svg>',
  grain: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="4" r="1"/><circle cx="8" cy="3" r=".8"/><circle cx="12.5" cy="5" r="1"/><circle cx="5" cy="8.5" r=".8"/><circle cx="10" cy="9" r="1.1"/><circle cx="3.5" cy="12.5" r="1"/><circle cx="8" cy="13" r=".8"/><circle cx="13" cy="12" r=".9"/></svg>',
};

const CONTROLS = {
  motion: { name: "Blur", fields: [
    { k: "distance", label: "Distance", min: 0, max: 400, step: 1, unit: " px" },
  ]},
  gaussian: { name: "More blur", fields: [] },
  levels: { name: "Intensity", fields: [
    { k: "tone", label: "Dark to light", min: -100, max: 100, step: 1, signed: true },
  ]},
  gradient: { name: "Color", fields: [] },
  grain: { name: "Grain", fields: [
    { k: "amount", label: "Amount", min: 0, max: 100, step: 1 },
    { k: "size", label: "Size", min: 1, max: 4, step: 0.05, unit: " px" },
  ]},
};

function fmt(f, v) {
  const d = f.step < 0.1 ? 2 : f.step < 1 ? 1 : 0;
  return (f.signed && v > 0 ? "+" : "") + Number(v).toFixed(d) + (f.unit || "");
}
function summary(id) {
  const L = state[id];
  if (id === "motion") return L.distance < 1 ? "No blur" : `${L.distance} px at ${L.angle}°`;
  if (id === "gaussian") { const i = BLUR_STEPS.indexOf(L.radius); return i < 0 ? "None" : `Step ${i + 1} of 4`; }
  if (id === "levels") {
    const t = L.tone === 0 ? "As in PSD" : (L.tone > 0 ? "Lighter +" : "Darker ") + L.tone;
    return t;
  }
  if (id === "grain") return L.amount <= 0 ? "None" : `${L.amount} at ${L.size.toFixed(2)} px${L.mono ? "" : ", color"}`;
  if (id === "gradient") return "";
  return "";
}

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const canvas = $("#view"), layersEl = $("#layers"), meta = $("#meta");
const toastEl = $("#toast");
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.hidden = true, 3600);
}

/* ---------- WebGL ---------- */
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
if (!gl) {
  $("#stage").innerHTML = '<p class="fail">This editor needs WebGL 2, which this browser doesn’t provide. Try a current version of Chrome, Safari, Edge or Firefox.</p>';
  return;
}
const floatOK = !!gl.getExtension("EXT_color_buffer_float");
const MAX_SIDE = Math.min(4096, gl.getParameter(gl.MAX_TEXTURE_SIZE));

const VS = `#version 300 es
in vec2 p; out vec2 v_uv;
void main(){ v_uv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
const HEAD = `#version 300 es
precision highp float; precision highp int;
in vec2 v_uv; out vec4 o; uniform sampler2D u_tex;
`;
const FS = {
  copy: HEAD + `void main(){ o = texture(u_tex, v_uv); }`,
  gauss: HEAD + `
uniform vec2 u_dir; uniform float u_sigma;
void main(){
  float radius = ceil(u_sigma*3.0);
  float st = max(1.0, radius/48.0);
  vec4 sum = vec4(0.0); float ws = 0.0;
  for (int i=-48; i<=48; i++){
    float x = float(i)*st;
    if (abs(x) > radius) continue;
    float w = exp(-x*x/(2.0*u_sigma*u_sigma));
    sum += texture(u_tex, v_uv + u_dir*x)*w; ws += w;
  }
  o = sum/ws;
}`,
  motion: HEAD + `
uniform vec2 u_vec;
void main(){
  vec4 sum = vec4(0.0);
  for (int i=0; i<128; i++){
    float t = float(i)/127.0 - 0.5;
    sum += texture(u_tex, v_uv + u_vec*t);
  }
  o = sum/128.0;
}`,
  levels: HEAD + `
uniform float u_ib, u_g; uniform int u_inv;
void main(){
  vec4 c = texture(u_tex, v_uv);
  vec3 v = clamp((c.rgb - u_ib)/max(1.0 - u_ib, 1e-4), 0.0, 1.0);
  v = pow(v, vec3(1.0/u_g));
  if (u_inv == 1) v = 1.0 - v;
  o = vec4(v, c.a);
}`,
  gmap: HEAD + `
uniform vec3 u_c0, u_c1; uniform float u_exp;

function drawHist() {
  const cv = document.getElementById("hist");
  if (!cv || !hist || !cv.clientWidth) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  let m = 1; for (let i = 1; i < 255; i++) m = Math.max(m, hist[i]);
  x.fillStyle = cs.getPropertyValue("--hist").trim();
  const bw = w / 256;
  for (let i = 0; i < 256; i++) {
    const bh = Math.min(1, Math.sqrt(hist[i] / m)) * (h - 4);
    x.fillRect(i * bw, h - bh, bw + 0.6, bh);
  }
  const P = levelsParams(state.levels);
  const mid = P.ib + (255 - P.ib) * Math.pow(0.5, P.gamma);
  x.fillStyle = cs.getPropertyValue("--accent").trim();
  for (const v of [P.ib, mid, 255]) x.fillRect(Math.min(w - 1.5, v / 255 * w), 0, 1.5, h);
}

// Random look: sets the blur and intensity controls, which all stay editable afterwards.
// Ranges come from the five example looks (intensity -22 to +44, More blur steps 2-4,
// Blur 118-341 px at any angle). Color and Invert are left as the person set them.
const RANDOM_RANGES = {
  tone: [-25, 45],
  blurStepWeights: [0, 0, 0.3, 0.4, 0.3], // none, step 1, 2, 3, 4
  distance: [110, 350],
};

  const u = Math.pow(Math.random(), 0.7);
  state.levels.tone = Math.round(RR.tone[0] + u * (RR.tone[1] - RR.tone[0]));
  const step = pickWeighted(RR.blurStepWeights);

const GEN_W = 2000, GEN_H = 1125;

precision highp float;

}

}

void main(){

    vec2 q = p*(3.0 + 3.0*u_p.x);
    q += 0.7*vec2(fbm(q*0.5 + 1.3), fbm(q*0.5 + 7.1));
    float r1 = pow(ridge(noise(q)), 10.0);
    float r2 = pow(ridge(noise(q*1.9 + 4.0)), 10.0);
    v = 0.45 + 0.35*fbm(p*1.5 + 2.0) + 0.55*r1 + 0.35*r2;
  } else if (u_mode == 1) {     // marbled flow
    vec2 q = p*(0.9 + 0.8*u_p.x);

    vec2 q2 = q + 1.3*w1;

  } else if (u_mode == 2) {     // long-exposure streaks
    float y = p.y + 0.18*fbm(vec2(p.x*0.8, p.y*1.5) + 3.0);
    vec2 s = vec2(p.x*(0.6 + 0.6*u_p.x), y*(9.0 + 8.0*u_p.y));

    vec2 c = vec2(mix(-0.4, 0.4, u_p.x), mix(-0.2, 0.2, u_p.y));

    float n = fbm(vec2(pp.x*0.5, y*7.0));
    float gl = pow(clamp(noise(vec2(pp.x*1.0, y*24.0) + 3.0)*1.7, 0.0, 1.0), 2.0);
    v = 0.15 + 0.8*smoothstep(-0.2, 0.3, n) + 0.5*gl;

    v *= mix(1.0, 0.3, mass);

    float hy = mix(0.05, 0.3, u_p.x);
    float sky = 0.84 + 0.12*(p.y - hy) + 0.04*fbm(p*2.0);
    float yy = max(hy - p.y, 0.0);
    float st = fbm(vec2(p.x*0.7, p.y*(18.0 + 40.0*u_p.y)));
    float water = 0.16 + 0.32*exp(-yy*7.0) + 0.3*smoothstep(-0.15, 0.35, st)*exp(-yy*2.5);

        const fins = RI(5, 16), finW = R(0.25, 0.5);

}
